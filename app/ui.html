<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telemetry · trace explorer</title>
<style>body{font-family:system-ui;background:#101722;color:#e7edf6;margin:0;padding:32px;max-width:1100px}h1{font-size:30px}p{color:#9aaec5}input,button{font:inherit;padding:12px;border-radius:7px;border:1px solid #3b5068;background:#192638;color:inherit;margin:4px}input{width:280px}button{cursor:pointer;background:#2459a0}.card{background:#192638;padding:20px;border-radius:12px;margin:20px 0}.row{display:grid;grid-template-columns:220px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #344256}.track{background:#101722;height:26px;position:relative}.bar{height:100%;background:#4facd3;border-radius:4px;position:absolute}.error{background:#e36969}code{font-size:12px}#message{white-space:pre-wrap;color:#c7d9ed}</style>
<h1>Distributed telemetry</h1><p>Explore a sampled request across service spans. Duration and offsets come from recorded telemetry.</p>
<div class="card"><label>API token <input id="token" type="password" placeholder="demo-token"></label><br><label>Trace ID <input id="trace" placeholder="32-character trace ID"></label><button id="load">Load timeline</button><p id="message">Use GET /demo on the Go agent to create a sample trace.</p></div><div id="timeline" class="card"></div>
<script>
document.getElementById('load').onclick=async()=>{const box=document.getElementById('timeline'),msg=document.getElementById('message');box.replaceChildren();try{const id=document.getElementById('trace').value;if(!/^[0-9a-f]{32}$/.test(id))throw Error('Enter a valid trace ID');const response=await fetch('/traces/'+id,{headers:{Authorization:'Bearer '+document.getElementById('token').value}});const data=await response.json();if(!response.ok)throw Error(data.detail||'Trace unavailable');const start=Math.min(...data.spans.map(s=>s.start_ms)),end=Math.max(...data.spans.map(s=>s.start_ms+s.duration_ms)),width=Math.max(1,end-start);msg.textContent=data.spans.length+' spans · '+width.toFixed(2)+' ms extent';for(const s of data.spans){const row=document.createElement('div');row.className='row';const label=document.createElement('div');label.textContent=(s.parent_id?'↳ ':'')+s.service+' · '+s.operation+' ('+s.duration_ms+' ms)';const track=document.createElement('div');track.className='track';const bar=document.createElement('div');bar.className='bar'+(s.status>=500?' error':'');bar.style.left=((s.start_ms-start)/width*100)+'%';bar.style.width=Math.max(.3,s.duration_ms/width*100)+'%';bar.title='span '+s.span_id+' · HTTP '+s.status;track.append(bar);row.append(label,track);box.append(row)}}catch(e){msg.textContent=e.message}};
</script></html>
